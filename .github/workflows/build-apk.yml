name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 26
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" || true
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          npm install @babel/plugin-transform-class-properties@7.27.1 @babel/plugin-transform-private-methods@7.27.1 @babel/plugin-transform-private-property-in-object@7.27.1 --save-dev --legacy-peer-deps

      - name: Create env file
        working-directory: ./frontend
        run: |
          echo "EXPO_PUBLIC_BACKEND_URL=https://credifacil-api-cr8u.onrender.com" > .env

      - name: Prebuild Android
        working-directory: ./frontend
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Gradle
        working-directory: ./frontend/android
        run: |
          echo "newArchEnabled=true" >> gradle.properties
          echo "hermesEnabled=true" >> gradle.properties
          echo "reactNativeArchitectures=arm64-v8a" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.configureondemand=true" >> gradle.properties

      - name: Build APK
        working-directory: ./frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --no-build-cache -x lint -x test
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrediFacil-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
