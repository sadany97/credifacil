name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          
      - name: Create .env file
        working-directory: ./frontend
        run: |
          echo "EXPO_PUBLIC_BACKEND_URL=https://credifacil-api-cr8u.onrender.com" > .env
          echo "EXPO_PUBLIC_APP_NAME=CrediFácil" >> .env

      - name: Prebuild Android
        working-directory: ./frontend
        run: npx expo prebuild --platform android --clean

      - name: Fix Gradle for build
        working-directory: ./frontend/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m" >> gradle.properties
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties

      - name: Build APK
        working-directory: ./frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrediFacil-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
