name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Create env file
        working-directory: ./frontend
        run: |
          echo "EXPO_PUBLIC_BACKEND_URL=https://credifacil-api-cr8u.onrender.com" > .env

      - name: Expo Prebuild
        working-directory: ./frontend
        run: npx expo prebuild --platform android --clean

      - name: Configure Gradle Memory
        working-directory: ./frontend/android
        run: |
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.configureondemand=true" >> gradle.properties
          echo "kotlin.incremental=false" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Build Release APK
        working-directory: ./frontend/android
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrediFacil-APK
          path: frontend/android/app/build/outputs/apk/release/*.apk
